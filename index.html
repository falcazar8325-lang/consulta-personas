<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Consulta de Personas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --primary: #1f3a5f;
  --secondary: #f4f6f8;
  --text: #333;
}

body {
  font-family: "Segoe UI", Roboto, Arial, sans-serif;
  margin: 0;
  background: var(--secondary);
  color: var(--text);
}

header {
  background: var(--primary);
  color: #fff;
  padding: 22px 16px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

header p {
  margin-top: 6px;
  font-size: 14px;
  opacity: 0.9;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.search-box {
  background: #fff;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.search-box input {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 6px;
}

.results {
  margin-top: 20px;
}

.card {
  background: #fff;
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.06);
}

.card strong {
  display: block;
  color: var(--primary);
  margin-bottom: 6px;
  font-size: 16px;
}

.card span {
  display: block;
  font-size: 14px;
  margin-bottom: 4px;
}

.no-results {
  text-align: center;
  color: #777;
  margin-top: 20px;
  font-size: 14px;
}

footer {
  text-align: center;
  font-size: 12px;
  color: #777;
  margin: 40px 10px 20px;
}

/* 🔥 ESTILOS DE EXPEDIENTE */
.expediente {
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  display: inline-block;
}

.exp-verde {
  background: #d4edda;
  color: #155724;
}

.exp-rojo {
  background: #f8d7da;
  color: #721c24;
}

.exp-naranja {
  background: #fff3cd;
  color: #856404;
}
</style>
</head>

<body>

<header>
  <h1>Consulta de Personas</h1>
  <p>Ingrese su número de documento</p>
</header>

<main>

  <div class="search-box">
    <input
      type="text"
      id="search"
      placeholder="Número de documento"
      inputmode="numeric"
    >
  </div>

  <div class="results" id="results"></div>

</main>

<footer>
  Consulta informativa · Datos actualizados automáticamente<br>
  <span id="lastUpdate"></span>
</footer>

<script>
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRWRQbiejsRyHimtz4YLWiWo1_bLxyWqioatbRHwryXeVAhUuk8YCiLJXZnDCQgzs21ALGWNKWIAhAz/pub?gid=0&single=true&output=csv";

let data = [];

function limpiar(texto) {
  return (texto || "").toString().trim();
}

function mostrarFechaActualizacion() {
  const ahora = new Date();
  document.getElementById("lastUpdate").innerText =
    "Última actualización: " +
    ahora.toLocaleDateString("es-PE") +
    " " +
    ahora.toLocaleTimeString("es-PE");
}

/* Parser CSV */
function parseCSV(text) {

  const rows = text.trim().split(/\r?\n/);
  rows.shift();

  return rows.map(row => {

    const cols = row.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);

    if (!cols || cols.length < 4) return null;

    return {
      id: limpiar(cols[0].replace(/"/g, "")),
      nombres: limpiar(cols[1].replace(/"/g, "")),
      apellidos: limpiar(cols[2].replace(/"/g, "")),
      actividad: limpiar(cols[3].replace(/"/g, "")),
      celular: limpiar((cols[4] || "").replace(/"/g, "")),

      // 🔥 NUEVA COLUMNA
      expediente: limpiar((cols[5] || "").replace(/"/g, ""))
    };

  }).filter(Boolean);
}

// Cargar datos
fetch(sheetURL + "&t=" + new Date().getTime())
  .then(res => {
    if (!res.ok) throw new Error("No se pudo cargar el CSV");
    return res.text();
  })
  .then(text => {
    data = parseCSV(text);
    mostrarFechaActualizacion();
  })
  .catch(err => {
    document.getElementById("results").innerHTML =
      "<div class='no-results'>Error cargando datos</div>";
    console.error(err);
  });

// Buscador
document.getElementById("search").addEventListener("input", function () {

  const value = limpiar(this.value);
  const results = document.getElementById("results");
  results.innerHTML = "";

  if (!value || data.length === 0) return;

  const encontrados = data.filter(p => limpiar(p.id) === value);

  if (encontrados.length === 0) {
    results.innerHTML =
      "<div class='no-results'>No se encontró información para el número ingresado</div>";
    return;
  }

  encontrados.forEach(p => {

    const estado = (p.expediente || "").toLowerCase().trim();

    let claseEstado = "exp-naranja";

    if (estado === "documentacion completa") {
      claseEstado = "exp-verde";
    } else if (estado === "no realizo 2do pago") {
      claseEstado = "exp-rojo";
    }

    results.innerHTML += `
      <div class="card">
        <strong>${p.nombres} ${p.apellidos}</strong>
        <span><b>N° documento:</b> ${p.id}</span>
        <span><b>Actividad económica:</b> ${p.actividad}</span>
        <span><b>Celular(es):</b> ${p.celular ? p.celular : "-"}</span>
        <span>
          <b>Expediente:</b> 
          <span class="expediente ${claseEstado}">
            ${p.expediente}
          </span>
        </span>
      </div>
    `;
  });

});
</script>

</body>
</html>

</body>
</html>
